# On each push to main that touches listings, the blocklist or the scripts:
# stores every approved .crx that isn't stored yet on the registry's Release
# `<id>-<version>` (re-verifying it against release.json first), builds the
# site (the store pages, updates/<id>.xml, index.json, blocked.json) and
# deploys it to the shelf Worker. Re-running is safe: stored releases are
# compared, never replaced, and any problem stops the run before the deploy,
# leaving the live site as it was.
name: Publish

on:
  push:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'blocklist.json'
      - 'delisted.json'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions: {}

# Never cancelled: a run may be creating releases. A newer push waits.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Store releases and build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # The review trail links each release to the pull request that approved it.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # The scripts need no install; the tests guard against publishing with broken checks.
      - name: Test
        run: node --test 'scripts/**/*.test.ts'
      # The review trail's cache (scripts/trail-cache.ts): one entry per stored
      # Release tag, which never changes, so the newest cache is always usable.
      - name: Restore the trail cache
        id: trail-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/trail
          key: trail-v1-${{ hashFiles('extensions/**/release.json', 'blocklist.json', 'delisted.json') }}
          restore-keys: trail-v1-
      - name: Store releases and build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish.ts _site
      # Saved even when publish stopped part-way, so what it learned isn't lost.
      # Skipped when nothing was written or this exact key is already saved.
      - name: Save the trail cache
        if: ${{ !cancelled() && steps.trail-cache.outputs.cache-hit != 'true' && hashFiles('.cache/trail/**') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/trail
          key: ${{ steps.trail-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          include-hidden-files: true
          retention-days: 7

  # The Cloudflare token is a secret of the `production` environment, which
  # only main can deploy to, so no pull request workflow can ever read it.
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: production
      url: https://shelf.niduslabs.dev
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The production environment has no CLOUDFLARE_API_TOKEN secret."
            exit 1
          fi
          pnpm exec wrangler deploy --tag "${SHA:0:12}"
      # The new index.json must be the one answering. DNS over HTTPS through
      # Cloudflare: a runner's resolver may cache "no such domain" from before
      # the custom domain existed. The query string skips any cached copy.
      - name: Check the live site
        env:
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 12); do
            code=$(curl --silent --max-time 10 --doh-url https://cloudflare-dns.com/dns-query \
              --dump-header headers.txt --output live.json --write-out '%{http_code}' \
              "https://shelf.niduslabs.dev/index.json?build=${SHA:0:12}" || true)
            if [ "$code" = 200 ] && cmp -s live.json _site/index.json; then
              echo "shelf.niduslabs.dev serves this build"
              exit 0
            fi
            echo "Waiting: HTTP $code $(grep -i -E '^(server|cf-mitigated|cf-ray|content-type):' headers.txt 2>/dev/null | tr -d '\r' | tr '\n' ' ')"
            sleep 10
          done
          echo "::error::shelf.niduslabs.dev doesn't serve this build's index.json"
          exit 1
