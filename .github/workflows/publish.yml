# On each push to main that touches listings, the blocklist or the scripts:
# stores every approved .crx that isn't stored yet on the registry's Release
# `<id>-<version>` (re-verifying it against release.json first), builds the
# site (updates/<id>.xml, index.json, blocked.json) and deploys it to GitHub
# Pages. Re-running is safe: stored releases are compared, never replaced, and
# any problem stops the run before the deploy, leaving the live site as it was.
name: Publish

on:
  push:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'blocklist.json'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions: {}

# Never cancelled: a run may be creating releases. A newer push waits.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Store releases and build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # The scripts need no install; the tests guard against publishing with broken checks.
      - name: Test
        run: node --test 'scripts/**/*.test.ts'
      - name: Store releases and build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish.ts _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
