# Checks listing and release pull requests (plans/shelf.md, "Checks on every
# PR") and posts the results as one comment, updated on each push.
#
# Security: this runs under `pull_request_target`, so it has a token that can
# comment even on PRs from forks. It must never run anything from the PR:
#   - it checks out `main` (the default for this event), never the PR's head;
#   - it installs nothing: scripts/ uses `node:` modules only and Node runs the
#     TypeScript directly;
#   - the PR's files are read through the API as data, and PR fields reach the
#     script through `env`, never by interpolating them into `run`.
#
# It also uploads `verdict.json` (whether the PR may be merged without a
# person, and why not). auto-merge.yml reads it in a separate run, so the token
# that can merge never runs alongside anything a PR can influence.
name: PR check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'extensions/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check listing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          VERDICT_PATH: verdict.json
        run: node scripts/pr-check.ts
      - uses: actions/upload-artifact@v7
        with:
          name: verdict
          path: verdict.json
          if-no-files-found: error
          retention-days: 1
